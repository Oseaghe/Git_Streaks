<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track your GitHub contribution streaks and stay motivated with our professional streak tracker">
    <meta name="keywords" content="GitHub, streak, tracker, contributions, developer, coding">
    <meta name="author" content="GitStreak">
    <meta name="theme-color" content="#667eea">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gitstreak.com/">
    <meta property="og:title" content="GitStreak - GitHub Contribution Streak Tracker">
    <meta property="og:description" content="Track your GitHub contribution streaks and stay motivated with our professional streak tracker">
    <meta property="og:image" content="https://gitstreak.com/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://gitstreak.com/">
    <meta property="twitter:title" content="GitStreak - GitHub Contribution Streak Tracker">
    <meta property="twitter:description" content="Track your GitHub contribution streaks and stay motivated with our professional streak tracker">
    <meta property="twitter:image" content="https://gitstreak.com/og-image.png">
    
    <title>GitStreak - GitHub Contribution Streak Tracker</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/app.js" as="script">
    
    <style>
        /* Critical CSS for initial load */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            font-size: 1.2rem;
            font-weight: 500;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <div style="text-align: center;">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading GitStreak...</div>
            </div>
        </div>
    </div>
    
    <script src="/app.js"></script>
    <script>
        // Remove loading screen when app is ready
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loadingScreen = document.querySelector('.loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.transition = 'opacity 0.5s ease';
                    setTimeout(function() {
                        loadingScreen.remove();
                    }, 500);
                }
            }, 1000);
        });
    </script>
</body>
</html>
